# Phase 2: aggregation. Run against the super cohort (previous aggregate SGs +
# new plate SGs) — normally created and submitted automatically by phase 1's
# SubmitPhase2 stage; use this config for a manual phase-2 run (second_workflow)
# against an existing super cohort. Rolls the previous aggregate forward, merges
# the new plates, and registers the aggregate and QC outputs against the super
# cohort. See "Rolling aggregate & two-phase run" in the README.
[workflow]
name = 'popgen_genotyping'

# mandatory fields for cpg-flow, not populated by analysis-runner
dataset = 'ourdna'
# Exactly one cohort: the manually created super cohort.
input_cohorts = ['COH200']
sequencing_type = 'array'

# The second_workflow entry point pins this run to the phase-2 stages; set
# only_stages only for a within-phase subset (e.g. re-running just the QC report).

# used to make sure we don't repeat previously completed stages
check_expected_outputs = true

# the method to register outputs, can be missing - will not generate metamist analysis entries
status_reporter = 'metamist'

# TODO(you): set to the current tag of this repo's own image — the phase-2 driver runs
# in it and needs the popgen_genotyping package. An automatic hand-off forwards phase 1's
# driver_image instead of reading this file; pin an exact tag, never ':latest'. CI builds
# a new tag on every merge to main; list them with:
#   gcloud artifacts docker tags list australia-southeast1-docker.pkg.dev/cpg-common/images/popgen_genotyping
driver_image = 'australia-southeast1-docker.pkg.dev/cpg-common/images/popgen_genotyping:0.1.0-28'
bcftools_image = 'australia-southeast1-docker.pkg.dev/cpg-common/images/bcftools:1.23-1'
plink_image = 'australia-southeast1-docker.pkg.dev/cpg-common/images/plink:1.9-20250819-PLINK-2.0-20260228-1'
king_image = 'australia-southeast1-docker.pkg.dev/cpg-common/images/king:2.3.2-1'
version = 1

[popgen_genotyping.merge_cohort_plink]
cpu = 4
memory = 'highmem'
storage = '100G'
# TODO(you): uncomment and set. Required: the Metamist cohort ID of the previous
# aggregate to roll forward, or the literal 'bootstrap' to declare a from-scratch build.
# There is no default, so a forgotten entry fails the run instead of silently building a
# new-plates-only aggregate. Use scripts/list_aggregates.py to pick a cohort ID.
# previous_aggregate_cohort_id = 'COH123'

[popgen_genotyping.export_cohort_datasets]
cpu = 2
memory = 'standard'
storage = '50G'

[popgen_genotyping.plink2_qc]
cpu = 2
memory = 'standard'
storage = '20G'

[popgen_genotyping.king_ibdseg]
cpu = 8
memory = 'highmem'
storage = '50G'

[popgen_genotyping.snp_qc_report]
cpu = 2
memory = 'standard'
storage = '20G'
# References-repo keys for the EGT INFO BCF + its index. Defaults match the
# GDA-8v1-0_D1 ClusterFile shipped under gs://cpg-common-main/references/illumina_microarray/.
# Override when running against a different Illumina chip / cluster-file revision.
egt_info_bcf_reference_key = 'illumina_microarray/GDA_8v1_0_D1_ClusterFile_egt_info_bcf'
egt_info_bcf_index_reference_key = 'illumina_microarray/GDA_8v1_0_D1_ClusterFile_egt_info_bcf_index'

[popgen_genotyping.snp_qc_report.extract]
cpu = 1
memory = 'standard'
storage = '10G'

[popgen_genotyping.snp_qc_report.hwe]
cpu = 2
memory = 'standard'
storage = '50G'

[popgen_genotyping.snp_qc_report.thresholds]
gentrain_min = 0.7
cluster_sep_min = 0.4
# F_MISS = 1 - call rate.
fmiss_max = 0.02
# plink2 --hwe p k [midp] [keep-fewhet]: drop variants with HWE exact p-value
# below p * 10^(-n*k), where n is the sample size. See
# https://www.cog-genomics.org/plink/2.0/filter#hwe.
hwe_p = 1e-5
hwe_k = 0.001
hwe_midp = true
hwe_keep_fewhet = true

[popgen_genotyping.qc_report]
cpu = 2
memory = 'standard'
storage = '20G'
