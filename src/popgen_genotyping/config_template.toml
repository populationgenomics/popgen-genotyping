# this is a template for the config file
# demonstrating some of the common options used in cpg-flow
[workflow]

# TODO(you): update this to reflect the workflow's name
name = 'popgen_genotyping'

# mandatory fields for cpg-flow, not populated by analysis-runner
dataset = 'ourdna'
sequencing_type = 'array'

# This pipeline runs in TWO phases (two separate invocations of run_workflow), with a
# manual super-cohort creation in Metamist (Swagger) in between.
#
#   Manual (any time before phase 2): create the super cohort, with membership =
#     the previous aggregate's sequencing groups + the new plates' sequencing groups.
#     (All sequencing groups already exist in Metamist.)
#
#   Phase 1 - per-plate processing. Set here in [workflow]:
#     input_cohorts = ['COH_new_plate_a', 'COH_new_plate_b']   # the new plates
#     last_stages   = ['BafRegress', 'CohortBcfToPlink']       # stop before the merge
#
#   Phase 2 - merge onto the super cohort. Set here in [workflow]:
#     input_cohorts = ['COH_super']                            # the super cohort
#     first_stages  = ['MergeCohortPlink']                     # start at the merge
#   and under [popgen_genotyping.merge_cohort_plink]:
#     new_cohort_ids                 = the same new plates listed in phase 1's input_cohorts
#     previous_aggregate_analysis_id = the previous aggregate (optional)
#
# Both phases MUST use the same `version` below: phase 2 reconstructs the phase-1
# per-plate output paths (which embed the version) to locate its merge inputs.
input_cohorts = []

# used to make sure we don't repeat previously completed stages
check_expected_outputs = true

# the method to register outputs, can be missing - will not generate metamist analysis entries
status_reporter = 'metamist'

driver_image = 'australia-southeast1-docker.pkg.dev/cpg-common/images/cpg_flow:latest'
bcftools_image = 'australia-southeast1-docker.pkg.dev/cpg-common/images/bcftools:1.23-1'
plink_image = 'australia-southeast1-docker.pkg.dev/cpg-common/images/plink:1.9-20250819-PLINK-2.0-20260228-1'
king_image = 'australia-southeast1-docker.pkg.dev/cpg-common/images/king:2.3.2-1'
version = 1

[popgen_genotyping.gtc_to_bcfs]
cpu = 2
memory = 'standard'
storage = '50G'

[popgen_genotyping.baf_regress]
cpu = 1
memory = 'standard'
storage = '10G'

[popgen_genotyping.cohort_bcf_to_plink]
cpu = 8
memory = 'highmem'
storage = '50G'

[popgen_genotyping.merge_cohort_plink]
cpu = 4
memory = 'highmem'
storage = '100G'
# Phase 2 only. The new plate cohorts processed in phase 1 (the same list as phase 1's
# input_cohorts). Their per-plate PLINK 1.9 outputs are located by reconstructing the
# phase-1 CohortBcfToPlink paths (which live in tmp storage, so phase 2 must run before
# tmp is garbage-collected). Also drives the BAFRegress paths folded into QcReport
# (new plates only).
# new_cohort_ids = ['COH_new_plate_a', 'COH_new_plate_b']
# Optional. The Metamist analysis ID of the previous aggregate to fold in (the PLINK2
# pgen from a prior ExportCohortDatasets run).
# previous_aggregate_analysis_id = 123456

[popgen_genotyping.export_cohort_datasets]
cpu = 2
memory = 'standard'
storage = '50G'

[popgen_genotyping.plink2_qc]
cpu = 2
memory = 'standard'
storage = '20G'

[popgen_genotyping.king_ibdseg]
cpu = 8
memory = 'highmem'
storage = '50G'

[popgen_genotyping.snp_qc_report]
cpu = 2
memory = 'standard'
storage = '20G'
# References-repo keys for the EGT INFO BCF + its index. Defaults match the
# GDA-8v1-0_D1 ClusterFile shipped under gs://cpg-common-main/references/illumina_microarray/.
# Override when running against a different Illumina chip / cluster-file revision.
egt_info_bcf_reference_key = 'illumina_microarray/GDA_8v1_0_D1_ClusterFile_egt_info_bcf'
egt_info_bcf_index_reference_key = 'illumina_microarray/GDA_8v1_0_D1_ClusterFile_egt_info_bcf_index'

[popgen_genotyping.snp_qc_report.extract]
cpu = 1
memory = 'standard'
storage = '10G'

[popgen_genotyping.snp_qc_report.hwe]
cpu = 2
memory = 'standard'
storage = '50G'

[popgen_genotyping.snp_qc_report.thresholds]
gentrain_min = 0.7
cluster_sep_min = 0.4
# F_MISS = 1 - call rate.
fmiss_max = 0.02
# plink2 --hwe p k [midp] [keep-fewhet]: drop variants with HWE exact p-value
# below p * 10^(-n*k), where n is the sample size. See
# https://www.cog-genomics.org/plink/2.0/filter#hwe.
hwe_p = 1e-5
hwe_k = 0.001
hwe_midp = true
hwe_keep_fewhet = true

[popgen_genotyping.qc_report]
cpu = 2
memory = 'standard'
storage = '20G'

[popgen_genotyping.references]
fasta_ref_path = 'gs://cpg-common-main/references/hg38/v0/Homo_sapiens_assembly38.fasta'
bpm_manifest_path = 'gs://...'
egt_cluster_path = 'gs://...'
# Optional: population allele frequency reference for BAFRegress
# af_ref_path = 'gs://...'
