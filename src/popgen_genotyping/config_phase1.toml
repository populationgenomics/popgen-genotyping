# Phase 1: per-plate processing. Run against the new plate cohorts (first_workflow).
# Produces and registers the per-plate `array_cohort_bed` and `array_bafregress`
# outputs that phase 2 later discovers via Metamist, then the SubmitPhase2 stage
# creates the super cohort and submits phase 2 automatically. See "Rolling
# aggregate & two-phase run" in the README.
[workflow]
name = 'popgen_genotyping'

# mandatory fields for cpg-flow, not populated by analysis-runner
dataset = 'ourdna'
# The new plate cohorts to process (one or more).
input_cohorts = ['COH101', 'COH102']
sequencing_type = 'array'

# The first_workflow entry point pins this run to the phase-1 stages; only_stages is
# only needed for a within-phase subset. To accumulate plates across several phase-1
# runs without the automatic phase-2 hand-off, stop before SubmitPhase2 with:
# last_stages = ['BafRegress', 'CohortBcfToPlink']

# used to make sure we don't repeat previously completed stages
check_expected_outputs = true

# the method to register outputs, can be missing - will not generate metamist analysis entries
status_reporter = 'metamist'

# TODO(you): set to the current tag of this repo's own image. The SubmitPhase2 job runs
# in it and needs the popgen_genotyping package, and it doubles as the image the phase-2
# run is submitted with (no repo checkout). Pin an exact tag, never ':latest': phase 2
# resolves this string at its own start, so a floating tag can run the two phases on
# different code. CI builds a new tag on every merge to main; list them with:
#   gcloud artifacts docker tags list australia-southeast1-docker.pkg.dev/cpg-common/images/popgen_genotyping
driver_image = 'australia-southeast1-docker.pkg.dev/cpg-common/images/popgen_genotyping:0.1.0-28'
bcftools_image = 'australia-southeast1-docker.pkg.dev/cpg-common/images/bcftools:1.23-1'
plink_image = 'australia-southeast1-docker.pkg.dev/cpg-common/images/plink:1.9-20250819-PLINK-2.0-20260228-1'
king_image = 'australia-southeast1-docker.pkg.dev/cpg-common/images/king:2.3.2-1'
version = 1

[popgen_genotyping.gtc_to_bcfs]
cpu = 2
memory = 'standard'
storage = '50G'

[popgen_genotyping.baf_regress]
cpu = 1
memory = 'standard'
storage = '10G'

[popgen_genotyping.cohort_bcf_to_plink]
cpu = 8
memory = 'highmem'
storage = '50G'

[popgen_genotyping.merge_cohort_plink]
# TODO(you): uncomment and set. Required: the Metamist cohort ID of the previous
# aggregate to roll forward, or the literal 'bootstrap' to declare a from-scratch build.
# There is no default, so a forgotten entry fails the run instead of silently building a
# new-plates-only aggregate. Use scripts/list_aggregates.py to pick a cohort ID.
# The SubmitPhase2 stage reads the same key when computing the super-cohort membership,
# so the two phases cannot drift.
# previous_aggregate_cohort_id = 'COH123'

[popgen_genotyping.submit_phase2]
# TODO(you): uncomment and set. Required for phase 1 (first_workflow): name for the super
# cohort the SubmitPhase2 stage creates (previous aggregate SGs + this run's plate SGs).
# Must not collide with an existing cohort name; if a cohort with identical membership
# already exists it is reused and this name is ignored.
# super_cohort_name = 'array-aggregate-2026-08-10'

[popgen_genotyping.references]
fasta_ref_path = 'gs://cpg-common-main/references/hg38/v0/Homo_sapiens_assembly38.fasta'
# Illumina chip manifest + cluster file. These match the GDA chip shipped under
# gs://cpg-common-main/references/illumina_microarray/; override when running
# against a different chip / cluster-file revision.
bpm_manifest_path = 'gs://cpg-common-main/references/illumina_microarray/GDA-8v1-0_D2.bpm'
egt_cluster_path = 'gs://cpg-common-main/references/illumina_microarray/GDA-8v1-0_D1_ClusterFile.egt'
# Optional: population allele frequency reference for BAFRegress
# af_ref_path = 'gs://...'
